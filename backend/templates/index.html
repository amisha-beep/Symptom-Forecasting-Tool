<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Symptom Forecasting Tool</title>

    <!-- CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <!-- Floating Medical Icons -->
    <div class="floating-icon stethoscope">🩺</div>
    <div class="floating-icon syringe">💉</div>
    <div class="floating-icon heart">❤️</div>

    <!-- AUTHENTICATION PAGE -->
    <div class="auth-page" id="authPage">

        <div class="auth-card">

            <h1>🌸 Symptom Forecast </h1>
            <p>AI-Powered Health Monitoring Dashboard</p>

            <!-- Tabs -->
            <div class="auth-tabs">
                <button id="showLogin" class="glass-btn active-tab">
                    Sign In
                </button>

                <button id="showSignup" class="glass-btn">
                    Sign Up
                </button>
            </div>

            <!-- LOGIN FORM -->
            <form id="loginForm">

                <input
                    type="text"
                    id="loginUsername"
                    placeholder="Username"
                    required
                >

                <input
                    type="password"
                    id="loginPassword"
                    placeholder="Password"
                    required
                >

                <button type="submit" class="glass-btn auth-btn">
                    Sign In
                </button>

                <p id="loginMessage" class="message"></p>

            </form>

            <!-- SIGNUP FORM -->
            <form id="signupForm" action="/signup" method="POST" style="display:none;">

               <input
                    type="text"
                    id="signupUsername"
                    name="username"
                    placeholder="Create Username"
                    required
                 >



                <input
                    type="password"
                    id="signupPassword"
                    name="password"
                    placeholder="Create Password"
                    required
                 >             
                

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm Password"
                    required
                >

                <button type="submit" class="glass-btn auth-btn">
                    Sign Up
                </button>

                <p id="signupMessage" class="message"></p>

            </form>

        </div>

    </div>

    <!-- MAIN APP -->
    <div class="container" id="appContainer" style="display:none;">

        <!-- HEADER -->
        <div class="header">

            <h1>🩺  Symptom Forecasting Tool</h1>

            <p>
                Predict symptom severity and monitor health trends
            </p>

            <div class="header-buttons">

                <button
                    id="themeToggle"
                    class="glass-btn"
                    type="button">
                    🌙 Dark Mode
                </button>

                <button
                    id="logoutBtn"
                    class="glass-btn logout-btn"
                    type="button">
                    🚪 Logout
                </button>

            </div>

        </div>

        <!-- DASHBOARD STATS -->
        <div class="stats">

            <div class="stat-card">
                <h3>24/7</h3>
                <p>Monitoring</p>
            </div>

            <div class="stat-card">
                <h3>50+</h3>
                <p>Symptoms</p>
            </div>

            <div class="stat-card">
                <h3>7 Days</h3>
                <p>Forecast</p>
            </div>

        </div>

        <!-- HEALTH FORM -->
        <form id="symptomForm">

            <input
                type="text"
                id="name"
                placeholder="Full Name"
                required
            >

            <input
                type="number"
                id="age"
                placeholder="Age"
                required
            >

            <h3>Select Symptoms</h3>

            <div class="symptom-selector">

                <input
                    type="text"
                    id="symptomSearch"
                    placeholder="🔍 Search Symptoms..."
                >

                <div
                    id="symptomDropdown"
                    class="dropdown">
                </div>

                <div
                    id="selectedSymptoms"
                    class="selected-symptoms">
                </div>

            </div>

            <button
                type="submit"
                class="glass-btn">
                🔍 Analyze Symptoms
            </button>

        </form>

        <!-- RESULT -->
        <div id="result"></div>

    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>

</body>
</html>
